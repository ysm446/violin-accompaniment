<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>violin-accompaniment</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <label>曲 <select id="song"></select></label>
      <button id="btn-play">▶ 再生</button>
      <button id="btn-stop">■ 停止</button>
      <button id="btn-reset">⏮ 最初から</button>
      <label>レート <input id="rate" type="range" min="0.5" max="1.5" step="0.01" value="1" /> <span id="rate-value">1.00</span></label>
      <button id="btn-follow" title="演奏に伴奏を追従させる">◎ 追従 OFF</button>
      <button id="btn-metronome" title="拍ごとにクリックを鳴らす(小節頭はアクセント)">♩ メトロノーム OFF</button>
      <label title="伴奏の音量">🔊 <input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label title="メトロノームの音量">♩🔊 <input id="metronome-volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <span id="status" class="status">core 未接続</span>
      <span id="info"></span>
    </header>
    <section id="audiobar">
      <label>入力 <select id="input"></select></label>
      <div id="meter" title="入力レベル"><div id="meter-fill"></div><span id="meter-db">-∞ dB</span></div>
      <canvas id="chroma" width="264" height="40" title="chroma(C〜B)"></canvas>
      <span id="audio-info"></span>
      <button id="btn-record">● 記録開始</button>
      <span id="record-info"></span>
    </section>
    <section id="feedbackbar">
      <label>振り返り <select id="session"></select></label>
      <button id="btn-analyze">解析</button>
      <button id="btn-clear-feedback">消す</button>
      <span id="feedback-summary"></span>
      <span id="feedback-legend"><i style="background:#2a7"></i>±15c <i style="background:#dc3"></i>±35c <i style="background:#d33"></i>それ以上 <i style="background:#39c"></i>早い <i style="background:#e83"></i>遅い</span>
    </section>
    <main id="sheet-container">
      <div id="sheet"></div>
      <div id="feedback-layer"></div>
      <div id="playhead"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
